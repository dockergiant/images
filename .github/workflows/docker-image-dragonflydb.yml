name: Docker Image DragonflyDB
on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images (ignore digest check)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 10 * * 0'
  push:
    paths:
      - .trigger
      - dragonfly/**
      - .github/workflows/*dragonfly*

jobs:
  discover-versions:
    name: Discover DragonflyDB Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      build_needed: ${{ steps.discover.outputs.build_needed }}
    steps:
      - name: Setup crane
        uses: imjasonh/setup-crane@v0.7

      - name: Login to GHCR (for digest check)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - name: Discover DragonflyDB versions
        id: discover
        run: |
          # A push changes the build context, which the base digest check cannot see.
          FORCE_REBUILD="${{ inputs.force_rebuild || github.event_name == 'push' }}"
          GHCR_BASE="ghcr.io/${{ github.repository_owner }}/dragonfly"
          DF_REGISTRY="docker.dragonflydb.io/dragonflydb/dragonfly"

          # Get all clean release tags (v-prefixed major.minor.patch)
          ALL_TAGS=$(crane ls "$DF_REGISTRY" 2>/dev/null \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')

          # Extract unique major.minor versions >= 1.15 (strip v prefix and patch)
          VERSIONS=$(echo "$ALL_TAGS" \
            | sed 's/^v//; s/\.[0-9]*$//' \
            | sort -uV \
            | awk -F'.' '$1 > 1 || ($1 == 1 && $2 >= 15)')

          echo "Discovered DragonflyDB versions: $VERSIONS"

          MATRIX='{"include":['
          FIRST=true
          for VERSION in $VERSIONS; do
            ESCAPED_VERSION=$(echo "$VERSION" | sed 's/\./\\./g')

            # Resolve latest patch (tags are v-prefixed)
            FULL_VERSION=$(echo "$ALL_TAGS" \
              | grep -E "^v${ESCAPED_VERSION}\.[0-9]+$" \
              | sort -Vr | head -n1)

            if [ -z "$FULL_VERSION" ]; then
              echo "⚠️  DragonflyDB ${VERSION}: No matching tag found, skipping"
              continue
            fi

            echo "DragonflyDB ${VERSION} -> ${FULL_VERSION}"

            UPSTREAM_DIGEST=$(crane digest "${DF_REGISTRY}:${FULL_VERSION}" 2>/dev/null || echo "")
            NEEDS_BUILD=false
            if [ "$FORCE_REBUILD" = "true" ]; then
              NEEDS_BUILD=true
              echo "  🔄 Force rebuild"
            else
              # Our image never shares the upstream digest, so compare the base digest recorded at build time.
              GHCR_BASE_DIGEST=$(crane config --platform linux/amd64 "${GHCR_BASE}:${VERSION}" 2>/dev/null \
                | jq -r '.config.Labels["org.opencontainers.image.base.digest"] // empty' || echo "")

              if [ -z "$GHCR_BASE_DIGEST" ]; then
                NEEDS_BUILD=true
                echo "  🆕 Not on GHCR or no base digest label"
              elif [ -z "$UPSTREAM_DIGEST" ]; then
                echo "  ⚠️  Could not get upstream digest, skipping"
                continue
              elif [ "$UPSTREAM_DIGEST" != "$GHCR_BASE_DIGEST" ]; then
                NEEDS_BUILD=true
                echo "  🔄 Digest changed"
              else
                echo "  ✅ Up to date"
              fi
            fi

            if [ "$NEEDS_BUILD" = "true" ]; then
              [ "$FIRST" = true ] && FIRST=false || MATRIX+=','
              MATRIX+="{\"version\":\"${VERSION}\",\"full_version\":\"${FULL_VERSION}\",\"base_digest\":\"${UPSTREAM_DIGEST}\"}"
            fi
          done
          MATRIX+=']}'

          echo "Matrix: $MATRIX"

          if [ "$MATRIX" = '{"include":[]}' ]; then
            echo "build_needed=false" >> $GITHUB_OUTPUT
          else
            echo "build_needed=true" >> $GITHUB_OUTPUT
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  dragonfly:
    name: DragonflyDB ${{ matrix.version }}
    needs: discover-versions
    if: needs.discover-versions.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ !env.ACT }}

      - uses: docker/build-push-action@v7
        with:
          context: dragonfly
          platforms: linux/amd64,linux/arm64
          build-args: DRAGONFLY_VERSION=${{ matrix.full_version }}
          push: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
          tags: ghcr.io/${{ github.repository_owner }}/dragonfly:${{ matrix.version }}
          labels: org.opencontainers.image.base.digest=${{ matrix.base_digest }}
        if: ${{ !env.ACT && github.ref == 'refs/heads/master'}}
