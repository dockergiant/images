name: Docker Image Inspector
on:
  workflow_dispatch:
  push:
    paths:
      - .trigger
      - inspector/**
      - .github/workflows/*inspector*

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      # ui/embed.go embeds ui/dist, which is not in git, so go vet and go test fail without it
      - name: ui build
        working-directory: inspector
        run: scripts/ui
      - uses: actions/setup-go@v6
        with:
          go-version-file: inspector/go.mod
          cache-dependency-path: inspector/go.sum
      - name: go vet
        working-directory: inspector
        run: go vet ./...
      - name: go test
        working-directory: inspector
        run: go test ./...
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: ui test
        working-directory: inspector
        run: node --test ui/test/*.test.js

  inspector:
    name: Inspector
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT && github.ref == 'refs/heads/master' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ !env.ACT }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: inspector
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/master' && !env.ACT }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/inspector:latest
            ghcr.io/${{ github.repository_owner }}/inspector:sha-${{ steps.sha.outputs.short }}
