server {
    listen 80 default_server;

    location = /ping {
        default_type text/plain;
        return 200 "pong\n";
    }

    location = /matrix.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/matrix/matrix.php;
        fastcgi_pass php-fpm:9000;
    }

    location / {
        return 404;
    }
}
